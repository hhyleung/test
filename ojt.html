<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OJT Tracker</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f172a;margin:0;color:#e2e8f0}
header{background:#020617;color:#fff;padding:24px 20px;border-bottom:1px solid #1e293b}main{max-width:650px;margin:auto;padding:16px}
.card{background:#1e293b;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #0006;overflow:hidden}
h1{margin:0;font-size:25px}h2{font-size:18px;color:#f1f5f9}label{display:block;font-size:13px;font-weight:600;margin:12px 0 7px;color:#94a3b8}
input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #334155;border-radius:11px;font-size:16px;background:#0f172a;color:#e2e8f0}
input[type="date"]{-webkit-appearance:none;appearance:none;min-width:0;-webkit-min-logical-width:0;color-scheme:dark}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.shift{padding:12px 5px;border:1px solid #334155;border-radius:11px;background:#0f172a;color:#e2e8f0;font-weight:700}.shift small{display:block;color:#94a3b8}.selected{background:#3b82f6;border-color:#3b82f6;color:white}.selected small{color:#dbeafe}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-width:0}.btn{width:100%;padding:14px;border:0;border-radius:12px;background:#3b82f6;color:#fff;font-weight:700;margin-top:16px}
.report{background:#0f172a;border:1px solid #334155;border-radius:12px;padding:14px;white-space:pre-wrap;font-family:monospace;line-height:1.6;color:#e2e8f0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#0f172a;border:1px solid #334155;border-radius:12px;padding:12px}.stat b{display:block;font-size:21px;color:#f1f5f9}.muted{color:#94a3b8;font-size:13px}
.item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #334155}.delete{border:0;border-radius:9px;padding:8px;background:#7f1d1d;color:#fecaca}
.today-preview{background:#422006;border:1px solid #f59e0b;border-radius:12px;padding:14px;margin-top:12px}.today-preview b{color:#fbbf24}
</style></head>
<body><header><h1>OJT Tracker</h1></header><main>
<section class="card"><h2>Prior</h2><div class="report" id="report"></div>
<div class="today-preview" id="todayPreview" style="display:none"><b>Pending record:</b><div id="todayDetails"></div></div></section>
<section class="card"><h2>Add Shift</h2>
<label>Date</label><input id="date" type="date">
<label>Shift</label><div class="grid">
<button class="shift" data-s="E">E<small>Early</small></button><button class="shift" data-s="F">F<small>Day</small></button>
<button class="shift" data-s="G">G<small>Day</small></button><button class="shift" data-s="H">H<small>Day</small></button>
<button class="shift" data-s="A">A<small>Afternoon</small></button><button class="shift" data-s="N">N<small>Night</small></button></div>
<div class="row"><div><label>Executive</label><input id="executive" type="number" min="0" step=".25"></div>
<div><label>Planner</label><input id="planner" type="number" min="0" step=".25"></div></div>
<button class="btn" id="save">Save</button></section>
<section class="card"><h2>Stats</h2><div class="stats">
<div class="stat"><b id="st">0</b><span>Total shifts</span></div><div class="stat"><b id="tt">0</b><span>Total hours</span></div>
<div class="stat"><b id="et">0</b><span>Executive hours</span></div><div class="stat"><b id="pt">0</b><span>Planner hours</span></div></div></section>
<section class="card"><h2>History</h2><div id="history"></div></section>
</main>
<script>
const API_URL="";
let selected=null,records=[],draft={shift:null,planner:0,executive:0};const $=x=>document.getElementById(x);
$("date").value=new Date().toISOString().slice(0,10);
document.querySelectorAll(".shift").forEach(b=>b.onclick=()=>{
    selected=b.dataset.s;draft.shift=selected;
    document.querySelectorAll(".shift").forEach(x=>x.classList.remove("selected"));
    b.classList.add("selected");updateTodayPreview()});
$("planner").oninput=$("executive").oninput=()=>{
    draft.planner=+$("planner").value||0;draft.executive=+$("executive").value||0;updateTodayPreview()};
function updateTodayPreview(){
    if(!draft.shift||(draft.planner===0&&draft.executive===0)){
        $("todayPreview").style.display="none";return}
    $("todayPreview").style.display="block";
    $("todayDetails").textContent=`${draft.shift} shift · Executive ${f(draft.executive)} hr · Planner ${f(draft.planner)} hr`}
async function load(){
    if(!API_URL)records=JSON.parse(localStorage.getItem("ojt_records")||"[]");
    else{let r=await fetch(API_URL+"/api/records");records=await r.json()}render()}
async function save(){
    if(!selected)return alert("Select a shift first.");
    let item={date:$("date").value,shift:selected,planner:+$("planner").value||0,executive:+$("executive").value||0};
    if(API_URL)await fetch(API_URL+"/api/records",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(item)});
    else{records.push(item);localStorage.setItem("ojt_records",JSON.stringify(records))}
    selected=null;draft={shift:null,planner:0,executive:0};
    document.querySelectorAll(".shift").forEach(x=>x.classList.remove("selected"));
    $("planner").value="";$("executive").value="";$("todayPreview").style.display="none";await load()}
async function del(i){if(!confirm("Delete this record?"))return;
    if(API_URL)await fetch(API_URL+"/api/records/"+records[i].id,{method:"DELETE"});
    else{records.splice(i,1);localStorage.setItem("ojt_records",JSON.stringify(records))}await load()}
function f(n){return Number.isInteger(n)?n:n.toFixed(2).replace(/0+$/,"").replace(/\.$/,"")}
function render(){
    let t={E:0,F:0,G:0,H:0,A:0,N:0,p:0,e:0};
    records.forEach(r=>{t[r.shift]++;t.p+=r.planner;t.e+=r.executive});

    $("report").textContent=`Early (E):      ${t.E}\nDay (F, G, H):  ${t.F+t.G+t.H}\nAfternoon (A):  ${t.A}\nNight (N):      ${t.N}\n\nExecutive:      ${f(t.e)}\nPlanner:        ${f(t.p)}`;

    let totalP=t.p+draft.planner,totalE=t.e+draft.executive;
    $("pt").textContent=f(totalP);$("et").textContent=f(totalE);
    $("st").textContent=records.length+(draft.shift?1:0);$("tt").textContent=f(totalP+totalE);

    $("history").innerHTML=records.length?records.map((r,i)=>`<div class="item"><div><b>${r.date}</b> · ${r.shift} shift<div class="muted">Executive ${f(r.executive)} hr · Planner ${f(r.planner)} hr</div></div><button class="delete" onclick="del(${i})">Delete</button></div>`).join(""):"<div class='muted'>No shifts recorded yet</div>"}
$("save").onclick=save;load();
</script></body></html>
