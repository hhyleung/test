<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OJT Tracker</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f172a;margin:0;color:#e2e8f0}
header{background:#020617;color:#fff;padding:24px 20px;border-bottom:1px solid #1e293b}main{max-width:650px;margin:auto;padding:16px}
.card{background:#1e293b;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #0006;overflow:hidden}
h1{margin:0;font-size:25px}h2{font-size:18px;color:#f1f5f9}label{display:block;font-size:13px;font-weight:600;margin:12px 0 7px;color:#94a3b8}
input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #334155;border-radius:11px;font-size:16px;background:#0f172a;color:#e2e8f0}
input[type="date"]{-webkit-appearance:none;appearance:none;min-width:0;-webkit-min-logical-width:0;color-scheme:dark}
input.instructor{text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.shift{padding:12px 5px;border:1px solid #334155;border-radius:11px;background:#0f172a;color:#e2e8f0;font-weight:700}.shift small{display:block;color:#94a3b8}.selected{background:#3b82f6;border-color:#3b82f6;color:white}.selected small{color:#dbeafe}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-width:0}.btn{width:100%;padding:14px;border:0;border-radius:12px;background:#3b82f6;color:#fff;font-weight:700;margin-top:16px}
.report{background:#0f172a;border:1px solid #334155;border-radius:12px;padding:14px;white-space:pre-wrap;font-family:monospace;line-height:1.6;color:#e2e8f0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#0f172a;border:1px solid #334155;border-radius:12px;padding:12px;text-align:center}.stat b{display:block;font-size:21px;color:#f1f5f9;margin-bottom:4px}.muted{color:#94a3b8;font-size:13px}
.item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #334155;font-family:monospace}.delete{border:0;border-radius:9px;padding:8px;background:#7f1d1d;color:#fecaca;}
.instr-stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.instr-row{display:flex;justify-content:space-between;font-size:14px;padding:4px 12px}
</style></head>
<body><header><h1>OJT Tracker</h1></header><main>
<section class="card"><div class="report" id="report"></div></section>
<section class="card"><h2>Add Shift</h2>
<div class="row"><div><label>Date</label><input id="date" type="date"></div>
<div><label>Instructor</label><input id="instructor" class="instructor" type="text" maxlength="2"></div></div>
<label>Shift</label><div class="grid">
<button class="shift" data-s="E1">E1<small>Early</small></button>
<button class="shift" data-s="F2">F2<small>Day</small></button>
<button class="shift" data-s="G1">G1<small>Day</small></button>
<button class="shift" data-s="H1">H1<small>Day</small></button>
<button class="shift" data-s="J1">J1<small>Afternoon</small></button>
<button class="shift" data-s="A1">A1<small>Afternoon</small></button>
<button class="shift" data-s="C1">C1<small>Afternoon</small></button>
<button class="shift" data-s="N2">N2<small>Night</small></button>
<button class="shift" data-s="N1">N1<small>Night</small></button></div>
<div class="row"><div><label>Executive</label><input id="executive" type="number" min="0" step=".25"></div>
<div><label>Planner</label><input id="planner" type="number" min="0" step=".25"></div></div>
<button class="btn" id="save">Save</button></section>
<section class="card"><h2>Stats</h2><div class="stats">
<div class="stat"><b id="st">0</b><span>Total Shifts</span></div><div class="stat"><b id="tt">0</b><span>Total Hours</span></div>
<div class="stat"><b id="et">0</b><span>Executive Hours</span></div><div class="stat"><b id="pt">0</b><span>Planner Hours</span></div></div>
<label>Instructors</label><div class="instr-stats" id="instructorStats"></div></section>
<section class="card"><h2>History</h2><div id="history"></div></section>
</main>
<script>
const API_URL="";
let selected=null,records=[];const $=x=>document.getElementById(x);
$("date").value=new Date().toISOString().slice(0,10);
$("instructor").oninput=()=>{$("instructor").value=$("instructor").value.toUpperCase().replace(/[^A-Z]/g,"").slice(0,2)};
document.querySelectorAll(".shift").forEach(b=>b.onclick=()=>{
    selected=b.dataset.s;
    document.querySelectorAll(".shift").forEach(x=>x.classList.remove("selected"));
    b.classList.add("selected")});
async function load(){
    if(!API_URL)records=JSON.parse(localStorage.getItem("ojt_records")||"[]");
    else{let r=await fetch(API_URL+"/api/records");records=await r.json()}render()}
async function save(){
    if(!selected)return alert("Select a shift first.");
    let item={date:$("date").value,shift:selected,instructor:($("instructor").value||"").toUpperCase().slice(0,2),planner:+$("planner").value||0,executive:+$("executive").value||0};
    if(API_URL)await fetch(API_URL+"/api/records",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(item)});
    else{records.push(item);localStorage.setItem("ojt_records",JSON.stringify(records))}
    selected=null;
    document.querySelectorAll(".shift").forEach(x=>x.classList.remove("selected"));
    $("planner").value="";$("executive").value="";$("instructor").value="";await load()}
async function del(i){if(!confirm("Delete this record?"))return;
    if(API_URL)await fetch(API_URL+"/api/records/"+records[i].id,{method:"DELETE"});
    else{records.splice(i,1);localStorage.setItem("ojt_records",JSON.stringify(records))}await load()}
function f(n){return Number.isInteger(n)?n:n.toFixed(2).replace(/0+$/,"").replace(/\.$/,"")}
function render(){
    let t={E1:0,F2:0,G1:0,H1:0,J1:0,A1:0,C1:0,N2:0,N1:0,p:0,e:0};
    let instr={};
    records.forEach(r=>{t[r.shift]++;t.p+=r.planner;t.e+=r.executive;if(r.instructor)instr[r.instructor]=(instr[r.instructor]||0)+1});

    $("report").textContent=`Early (E):             ${t.E1}\nDay (F, G, H):         ${t.F2+t.G1+t.H1}\nAfternoon (J, A, C):   ${t.J1+t.A1+t.C1}\nNight (N):             ${t.N2+t.N1}\n\nExecutive:   ${f(t.e)}\nPlanner:     ${f(t.p)}`;

    $("pt").textContent=f(t.p);$("et").textContent=f(t.e);
    $("st").textContent=records.length;$("tt").textContent=f(t.p+t.e);

    let instrList=Object.entries(instr).sort((a,b)=>b[1]-a[1]);
    $("instructorStats").innerHTML=instrList.length?instrList.map(([name,c])=>`<div class="instr-row"><span>${name}</span><span>${c} time${c===1?"":"s"}</span></div>`).join(""):"<div class='muted'>No instructor data yet</div>";

    let sorted=records.map((r,i)=>({...r,_i:i})).sort((a,b)=>new Date(a.date)-new Date(b.date));
    $("history").innerHTML=sorted.length?sorted.map((r,n)=>`<div class="item"><div>${String(n+1).padStart(3,"0")}&nbsp;${r.date}&nbsp;&nbsp;${r.shift}${r.instructor?"&nbsp;&nbsp;"+r.instructor:""}&nbsp;&nbsp;${f(r.executive+r.planner)} hr<div class="muted">Executive ${f(r.executive)} hr · Planner ${f(r.planner)} hr</div></div><button class="delete" onclick="del(${r._i})">Delete</button></div>`).join(""):"<div class='muted'>No shifts recorded yet</div>"}
$("save").onclick=save;load();
</script></body></html>
